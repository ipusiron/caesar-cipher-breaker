<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';
        img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self';">
    <meta name="referrer" content="no-referrer">
    <meta name="description"
        content="シーザー暗号を総当たりで解読し、単語の一致数または英語文字頻度のカイ二乗で候補を判定するツール。">
    <title>シーザー暗号解読ツール（Caesar Cipher Breaker）</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <div class="container">
        <div class="header-section">
            <h1 data-i18n="app.heading">🔓 シーザー暗号解読ツール（Caesar Cipher Breaker）</h1>
            <div class="header-buttons">
                <button class="theme-toggle lang-toggle" id="langToggleBtn" type="button"
                    data-i18n="app.langButton" data-i18n-aria-label="app.langAria"
                    aria-label="言語を切り替える">English</button>
                <button class="theme-toggle" id="themeToggleBtn" title="ダークモードに切り替える"
                    type="button" aria-label="ダークモードに切り替える" aria-pressed="false">
                    <span class="theme-icon" aria-hidden="true">🌙</span>
                </button>
            </div>
        </div>

        <div class="input-section">
            <div class="info-box">
                💡 <strong data-i18n="info.label">暗号文作成：</strong>
                <a href="https://ipusiron.github.io/caesar-cipher-wheel/" target="_blank" rel="noopener noreferrer">
                    Caesar Cipher Wheel Tool
                </a> <span data-i18n="info.suffix">で暗号文を作成できます</span>
            </div>
            <label for="cipherText" data-i18n="input.label">暗号文入力</label>
            <textarea id="cipherText" data-i18n-placeholder="input.placeholder"
                placeholder="ここに暗号文を入力...（空白なしにも対応）" rows="4">LW LV LPSRVVLEOH WR VDB KRZ ILUVW WKH LGHD HQWHUHG PB EUDLQ; EXW RQFH FRQFHLYHG, LW KDXQWHG PH GDB DQG QLJKW.</textarea>
            <button id="decryptBtn" type="button" data-i18n="button.decrypt"
                disabled>総当たり解読（全パターン表示）</button>
            <button id="clearBtn" type="button" data-i18n="button.clear">結果クリア</button>
            <button id="copySemanticBtn" type="button" data-i18n="button.copySemantic"
                hidden>Semantic Ranking形式でコピー</button>
        </div>

        <div id="results" aria-live="polite"></div>

        <div id="toast" class="toast" role="status" aria-live="polite"></div>

        <footer class="site-footer">
            <span data-i18n="footer.repo">🔗 GitHubリポジトリはこちら（</span><a
                href="https://github.com/ipusiron/caesar-cipher-breaker"
                target="_blank" rel="noopener noreferrer">ipusiron/caesar-cipher-breaker</a><span
                data-i18n="footer.repoEnd">）</span>
        </footer>
        <noscript>This tool requires JavaScript. / このツールの利用にはJavaScriptが必要です。</noscript>
    </div>

    <script src="i18n.js" defer></script>
    <script src="caesar-logic.js" defer></script>
    <script src="main.js" defer></script>
</body>
</html>
