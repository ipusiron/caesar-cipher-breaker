<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';
        img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self';">
    <meta name="referrer" content="no-referrer">
    <title>シーザー暗号解読ツール（Caesar Cipher Breaker）</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <div class="container">
        <div class="header-section">
            <h1>🔓 シーザー暗号解読ツール（Caesar Cipher Breaker）</h1>
            <button class="theme-toggle" id="themeToggleBtn" title="ダークモード切り替え"
                type="button" aria-label="ダークモード切り替え" aria-pressed="false">
                <span class="theme-icon">🌙</span>
            </button>
        </div>
        
        <div class="input-section">
            <div class="info-box">
                💡 <strong>暗号文作成：</strong> 
                <a href="https://ipusiron.github.io/caesar-cipher-wheel/" target="_blank" rel="noopener noreferrer">
                    Caesar Cipher Wheel Tool
                </a> で暗号文を作成できます
            </div>
            <label for="cipherText">暗号文入力</label>
            <textarea id="cipherText" placeholder="ここに暗号文を入力...（空白なしにも対応）" rows="4">LW LV LPSRVVLEOH WR VDB KRZ ILUVW WKH LGHD HQWHUHG PB EUDLQ; EXW RQFH FRQFHLYHG, LW KDXQWHG PH GDB DQG QLJKW.</textarea>
            <button id="decryptBtn" type="button" disabled>総当たり解読（全パターン表示）</button>
            <button id="clearBtn" type="button">結果クリア</button>
            <button id="copySemanticBtn" type="button" hidden>Copy for Semantic Ranking</button>
        </div>

        <div id="results" aria-live="polite"></div>

        <div id="toast" class="toast" role="status" aria-live="polite"></div>
        
        <footer class="site-footer">
            🔗 GitHubリポジトリはこちら（<a href="https://github.com/ipusiron/caesar-cipher-breaker"
                target="_blank" rel="noopener noreferrer">ipusiron/caesar-cipher-breaker</a>）
        </footer>
        <noscript>このツールの利用にはJavaScriptが必要です。</noscript>
    </div>
    
    <script src="caesar-logic.js" defer></script>
    <script src="main.js" defer></script>
</body>
</html>
